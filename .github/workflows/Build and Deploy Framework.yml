name: Build and Deploy Framework
 
on:
  push:
    branches: [main]
    paths-ignore:
      - "framework/build/**"     # don't react to the build commits this workflow makes
  pull_request:
    branches: [main]
  workflow_dispatch:
 
env:
  BUILD_OUTPUT: framework/build
  TARGET_DIR: framework/build
 
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Writes a temporary .npmrc on the runner only; your committed .npmrc is untouched
          registry-url: https://npm.pkg.github.com
          scope: "@tis-lab"
 
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
 
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 7
 
  publish-and-deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write             
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
 
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/new-build
 
      - name: Replace build directory
        run: |
          mkdir -p "${TARGET_DIR}"
          rsync -a --delete "${RUNNER_TEMP}/new-build/" "${TARGET_DIR}/"
 
      - name: Commit and push
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${TARGET_DIR}"
          if git diff --cached --quiet; then
            echo "Build output unchanged, nothing to deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update ${TARGET_DIR} from ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # in case main moved during the build
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
 
      - name: Trigger OpenShift httpd build
        if: steps.push.outputs.changed == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.OPENSHIFT_WEBHOOK_URL }}
          BUILD_SHA: ${{ steps.push.outputs.sha }}
        run: |
          payload=$(cat <<JSON
          {
            "git": {
              "uri": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git",
              "ref": "${GITHUB_REF_NAME}",
              "commit": "${BUILD_SHA}",
              "message": "Build from ${GITHUB_SHA::7}"
            }
          }
          JSON
          )
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" --data "$payload" "$WEBHOOK_URL")
          cat response.txt; echo
          if [ "$status" -ge 300 ]; then
            echo "::error::Webhook call failed with HTTP $status"
            exit 1
          fi
          echo "OpenShift build triggered for commit ${BUILD_SHA::7}."
